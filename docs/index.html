<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K-pop Activity Calendar</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.21/locales-all.global.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #657087;
      --line: #dfe4ec;
      --surface: #ffffff;
      --canvas: #f4f6fa;
      --accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", sans-serif;
    }
    .shell { width: min(1440px, 100%); margin: 0 auto; padding: 28px; }
    .hero {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 8px; font-size: clamp(24px, 3vw, 38px); letter-spacing: -.04em; }
    .subtitle, .updated { margin: 0; color: var(--muted); }
    .updated { white-space: nowrap; font-size: 13px; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(31, 41, 55, .06);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: center;
      padding: 14px 18px;
      margin-bottom: 14px;
    }
    .filter-group { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .filter-title { margin-right: 3px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      background: #fff;
      color: #4b5567;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip.active { background: #172033; border-color: #172033; color: #fff; }
    #calendar { padding: 18px; min-height: 680px; }
    .empty, .error { display: none; padding: 26px; text-align: center; color: var(--muted); }
    .fc .fc-toolbar-title { font-size: 21px; }
    .fc .fc-button-primary { background: #172033; border-color: #172033; }
    .fc .fc-button-primary:disabled { background: #aab1bf; border-color: #aab1bf; }
    .fc .fc-daygrid-event { border-radius: 5px; padding: 2px 4px; font-size: 12px; }
    .fc .fc-day-today { background: #eff6ff !important; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 0 18px 18px;
      color: var(--muted);
      font-size: 12px;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
    @media (max-width: 720px) {
      .shell { padding: 16px 10px; }
      .hero { display: block; }
      .updated { margin-top: 8px; }
      #calendar { padding: 10px; min-height: 620px; }
      .fc .fc-toolbar { align-items: flex-start; gap: 8px; }
      .fc .fc-toolbar-title { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <h1>4사 K-pop 활동 캘린더</h1>
        <p class="subtitle">HYBE · SM · JYP · YG · 오늘부터 향후 3개월</p>
      </div>
      <p class="updated" id="updated">데이터 불러오는 중…</p>
    </section>

    <section class="filters panel" aria-label="캘린더 필터">
      <div class="filter-group" id="company-filters">
        <span class="filter-title">회사</span>
      </div>
      <div class="filter-group" id="activity-filters">
        <span class="filter-title">활동</span>
      </div>
    </section>

    <section class="panel">
      <div id="calendar"></div>
      <div class="empty" id="empty">선택한 조건에 해당하는 일정이 없습니다.</div>
      <div class="error" id="error">캘린더 데이터를 불러오지 못했습니다.</div>
      <div class="legend">
        <span><i class="dot" style="background:#2563eb"></i>컴백</span>
        <span><i class="dot" style="background:#7c3aed"></i>투어 발표</span>
        <span><i class="dot" style="background:#9333ea"></i>투어 확장</span>
        <span><i class="dot" style="background:#dc2626"></i>추가 회차</span>
        <span><i class="dot" style="background:#ea580c"></i>앙코르</span>
        <span><i class="dot" style="background:#059669"></i>팬미팅</span>
        <span><i class="dot" style="background:#ca8a04"></i>팝업</span>
      </div>
    </section>
  </main>

  <script>
    const activityLabels = {
      COMEBACK: "컴백",
      TOUR_ANNOUNCEMENT: "투어 발표",
      TOUR_EXPANSION: "투어 확장",
      ADDITIONAL_SHOW: "추가 회차",
      ENCORE: "앙코르",
      FANMEETING: "팬미팅",
      POPUP: "팝업"
    };
    const companies = ["HYBE", "SM", "JYP", "YG"];
    const activities = Object.keys(activityLabels);
    const selectedCompanies = new Set(companies);
    const selectedActivities = new Set(["COMEBACK"]);
    let calendar;
    let allEvents = [];

    function addChips(containerId, values, selected, labels = {}) {
      const container = document.getElementById(containerId);
      values.forEach(value => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `chip ${selected.has(value) ? "active" : ""}`;
        button.textContent = labels[value] || value;
        button.setAttribute("aria-pressed", selected.has(value));
        button.addEventListener("click", () => {
          selected.has(value) ? selected.delete(value) : selected.add(value);
          button.classList.toggle("active", selected.has(value));
          button.setAttribute("aria-pressed", selected.has(value));
          calendar.refetchEvents();
        });
        container.appendChild(button);
      });
    }

    function filteredEvents() {
      return allEvents.filter(event =>
        selectedCompanies.has(event.extendedProps.company) &&
        selectedActivities.has(event.extendedProps.activityType)
      );
    }

    function updateEmptyState() {
      const empty = document.getElementById("empty");
      const visible = filteredEvents().length === 0;
      empty.style.display = visible ? "block" : "none";
    }

    async function start() {
      addChips("company-filters", companies, selectedCompanies);
      addChips("activity-filters", activities, selectedActivities, activityLabels);
      try {
        const response = await fetch(`calendar_events.json?t=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        allEvents = payload.events || [];
        const generated = payload.generatedAt
          ? new Intl.DateTimeFormat("ko-KR", {
              dateStyle: "medium", timeStyle: "short", timeZone: "Asia/Seoul"
            }).format(new Date(payload.generatedAt))
          : "아직 실행되지 않음";
        document.getElementById("updated").textContent =
          `마지막 업데이트 ${generated} · 전체 ${payload.eventCount || 0}건`;

        calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
          locale: "ko",
          initialView: window.innerWidth < 720 ? "listMonth" : "dayGridMonth",
          initialDate: payload.rangeStart || undefined,
          validRange: payload.rangeStart && payload.rangeEndExclusive
            ? { start: payload.rangeStart, end: payload.rangeEndExclusive }
            : undefined,
          firstDay: 1,
          height: "auto",
          dayMaxEvents: true,
          headerToolbar: {
            left: "prev,next today",
            center: "title",
            right: "dayGridMonth,listMonth"
          },
          events: (_info, success) => {
            success(filteredEvents());
            updateEmptyState();
          },
          eventClick: info => {
            info.jsEvent.preventDefault();
            if (info.event.url) window.open(info.event.url, "_blank", "noopener");
          },
          eventDidMount: info => {
            const p = info.event.extendedProps;
            const detail = [
              p.eventName,
              p.cities,
              p.venues,
              p.supportingArticleCount ? `관련 기사 ${p.supportingArticleCount}건` : ""
            ].filter(Boolean).join(" · ");
            info.el.title = detail;
          }
        });
        calendar.render();
      } catch (error) {
        document.getElementById("calendar").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("updated").textContent = "업데이트 상태 확인 필요";
      }
    }
    document.addEventListener("DOMContentLoaded", start);
  </script>
</body>
</html>
