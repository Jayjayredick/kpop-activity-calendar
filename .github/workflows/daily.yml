name: Daily K-pop activity tracker

on:
  schedule:
    - cron: "35 22 * * *" # 07:35 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: daily-kpop-activity
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect NAVER news from the previous 24 hours
        env:
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
        run: |
          PYTHONPATH=src python -m kpop_notice_collector.cli \
            --hours 24 \
            --out output/latest_activity_tracker.xlsx \
            --calendar-json docs/calendar_events.json
      - name: Persist calendar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events_history.csv data/daily_collected.csv docs/calendar_events.json
          git diff --cached --quiet || git commit -m "data: update daily activity tracker"
          git push
      - uses: actions/upload-artifact@v6
        with:
          name: activity-tracker-${{ github.run_id }}
          path: output/latest_activity_tracker.xlsx
          retention-days: 90
      - uses: actions/configure-pages@v6
      - name: Package GitHub Pages
        run: |
          tar --dereference --hard-dereference \
            --directory docs \
            -czf "$RUNNER_TEMP/github-pages.tar.gz" .
      - uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/github-pages.tar.gz
          retention-days: 1

  deploy-pages:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy calendar to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
