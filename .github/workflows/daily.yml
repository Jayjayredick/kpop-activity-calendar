name: Daily K-pop activity tracker

on:
  schedule:
    - cron: "35 22 * * *" # 07:35 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: calendar-data-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and classify NAVER news from the previous 24 hours
        env:
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
        run: |
          PYTHONPATH=src python -m kpop_notice_collector.cli \
            --hours 24 \
            --out output/latest_activity_tracker.xlsx \
            --calendar-json docs/calendar_events.json
      - name: Persist calendar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/events_history.csv \
            data/daily_collected.csv \
            data/review_queue.csv \
            docs/calendar_events.json \
            docs/review_queue.json
          git diff --cached --quiet || git commit -m "data: update daily activity tracker"
          git push
      - uses: actions/upload-artifact@v6
        with:
          name: activity-tracker-${{ github.run_id }}
          path: output/latest_activity_tracker.xlsx
          retention-days: 90
      - uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          retention-days: 1

  deploy-pages:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy calendar to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
