name: Apply calendar review

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: calendar-data-write
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[CALENDAR REVIEW]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Save issue body safely
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            fs.writeFileSync("issue_body.txt", context.payload.issue.body || "", "utf8");
      - name: Apply owner review decisions
        run: |
          PYTHONPATH=src python -m kpop_notice_collector.review_cli \
            --issue-body issue_body.txt \
            --repository "${{ github.repository }}"
      - name: Persist reviewed events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/events_history.csv \
            data/review_queue.csv \
            data/review_log.csv \
            docs/calendar_events.json \
            docs/review_queue.json
          git diff --cached --quiet || git commit -m "data: apply calendar owner review"
          git push
      - uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          retention-days: 1

  deploy-pages:
    needs: apply
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed calendar
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Close completed review issue
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "검토 결정이 캘린더에 반영되었습니다."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
